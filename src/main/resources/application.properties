# application.properties — Zadel
spring.application.name=zadel

# База данных PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/zadel?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=postgres
spring.datasource.password=Tuduta95

# JPA настройки
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway настройки (явные)
spring.flyway.url=jdbc:postgresql://localhost:5432/zadel
spring.flyway.user=postgres
spring.flyway.password=Tuduta95
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

# Отключаем стандартную инициализацию
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Порт
server.port=8086
server.address=0.0.0.0

# Логирование
logging.level.com.example=DEBUG
logging.level.org.flywaydb=DEBUG

# Статические ресурсы (для фото) - ДВЕ звёздочки!
spring.web.resources.static-locations=file:uploads/
spring.mvc.static-path-pattern=/uploads/**

file.upload-dir=uploads

# Multipart
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# URL брокера
saas.service.url=http://localhost:8085

# API-ключ для доступа к брокеру
api.key.zadel=zadel-api-key-2026